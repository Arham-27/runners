<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoChase</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Lobby Screen -->
    <div id="lobby-screen" class="screen">
        <div class="lobby-card">
            <h1>CHRONO<span class="highlight">CHASE</span></h1>
            <p class="subtitle">Real-Time Tactical GPS Hide & Seek</p>
            
            <div class="form-group">
                <label for="player-name">Agent Codename</label>
                <input type="text" id="player-name" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="room-code">Room Code</label>
                <input type="text" id="room-code" placeholder="e.g. CHASE01" value="CHASE01">
            </div>

            <div class="form-group">
                <label for="player-role">Select Role</label>
                <select id="player-role">
                    <option value="runner">Runner (Hider)</option>
                    <option value="seeker">Seeker (Hunter)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="secret-code">Secret Settings Code (Optional)</label>
                <input type="password" id="secret-code" placeholder="Enter code to unlock cheat options">
            </div>

            <button id="join-btn" class="primary-btn">INITIALIZE GAME</button>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="screen hidden">
        <header id="game-hud">
            <div class="hud-item">
                <div class="label">ROOM</div>
                <div id="hud-room" class="value">CHASE01</div>
            </div>
            <div class="hud-item">
                <div class="label">ROLE</div>
                <div id="hud-role" class="value">RUNNER</div>
            </div>
            <div class="hud-item">
                <div class="label">NEXT PING</div>
                <div id="hud-timer" class="value">05:00</div>
            </div>
            <div class="hud-item">
                <button id="cheat-ping-btn" class="danger-btn hidden">⚡ PING NOW</button>
            </div>
            <div class="hud-item">
                <button id="catch-btn" class="danger-btn hidden">🎯 CATCH RUNNER</button>
            </div>
        </header>

        <div id="game-body">
            <aside id="players-sidebar">
                <h3>OPERATIVES</h3>
                <div class="section-title" style="color: #da3633;">Hiders / Runners</div>
                <ul id="runners-list"></ul>
                
                <div class="section-title" style="color: #238636; margin-top: 15px;">Seekers</div>
                <ul id="seekers-list"></ul>
            </aside>

            <div id="map"></div>
        </div>
    </div>

    <!-- Catch Selection Modal -->
    <div id="catch-modal" class="screen modal hidden">
        <div class="lobby-card">
            <h2>Select Runner
